# Grafana datasource provisioning: the in-stack Prometheus (compose service "prometheus").
# The uid is referenced by observability/grafana/dashboards/ono.json - keep them in sync.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s      # matches scrape_interval so rate() windows line up
      httpMethod: POST
