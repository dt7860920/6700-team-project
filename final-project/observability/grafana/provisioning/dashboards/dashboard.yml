# Grafana dashboard provisioning: load every *.json under /var/lib/grafana/dashboards
# (bind-mounted from observability/grafana/dashboards/ in compose.yml).
apiVersion: 1

providers:
  - name: ono
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true          # tweak in the UI; export + commit to make it stick
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
