[project]
name = "diag-service"
version = "0.1.0"
description = "A minimal REAL FastAPI diagnostics service (fixture)."
requires-python = ">=3.10"
# PEP 621 dependencies: the verifier's builder must parse these (no requirements.txt here).
# httpx is what fastapi.testclient needs to drive the app without a server.
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]
