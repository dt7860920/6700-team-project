name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests (py3.13, mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy src/

      - name: pytest
        run: uv run pytest

      - name: Golden-path smoke (in-process, mock backend)
        run: uv run scripts/golden_path.py --in-process

  container:
    name: docker build + /health
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ono:ci .

      - name: Run and probe /health
        run: |
          docker run -d --name ono-ci -p 8080:8080 --env-file .env.example.production ono:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health | grep -q '"ok"'
          curl -fsS -X POST http://localhost:8080/scans -H 'content-type: application/json' \
            -d '{"target_id":"pygoat"}' | grep -q '"CWE-89"'
          docker rm -f ono-ci
