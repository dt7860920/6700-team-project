# Operation: Negative One - Compose stack.
#
# Two services, ONE published port (the app's 8080). Everything else is internal.
#
#   app       the ONO API + UI (container A). Unprivileged, read-only rootfs.
#   executor  the sandbox Executor (container C, Deliverable 3 step 3a). PRIVILEGED:
#             it mounts the host Docker socket so it can spawn one jailed target
#             container per scan. It is token-authenticated, sits on the `internal`
#             network only, and has NO `ports:` block - it is never reachable from
#             outside the stack. The target containers it spawns run with
#             network_mode=none, cap_drop=ALL, read-only rootfs, non-root, cgroup
#             limits (see src/ono/executor/sandbox.py) and never see the socket.
#
#   cp .env.example.production .env          # and set EXECUTOR_TOKEN (openssl rand -hex 32)
#   docker compose up -d --build
#   curl http://localhost:8080/health
#
#   caddy     OPT-IN (`--profile tls`): TLS termination. Publishes 80/443, proxies to the
#             app, obtains certificates automatically for ONO_DOMAIN (see Caddyfile). With
#             this profile on, set ONO_APP_BIND=127.0.0.1 so the app's own :8080 is no
#             longer on the public interface and the proxy is the only published listener:
#
#   echo "ONO_DOMAIN=ono.example.org" >> .env;  echo "ONO_APP_BIND=127.0.0.1" >> .env
#   echo "TRUSTED_PROXY=true" >> .env           # rate limits key on X-Forwarded-For from Caddy
#   docker compose --profile tls up -d --build  # or: make compose-up-tls
#   curl https://ono.example.org/health
#
# Why the socket mount is acceptable here, and nowhere else: holding the Docker socket
# is equivalent to root on the host, so the Executor is kept tiny and audited (one
# FastAPI module + the sandbox manager), accepts only token-bearing requests from the
# internal network, validates every input, and runs nothing untrusted itself - all
# untrusted code runs inside the jails it creates. The findings DB / threat-intel
# cache / vLLM (later steps) join as further internal services without `ports:`.
#
# Optional profile `observability` (plan §8.6 layer 2): Prometheus scrapes the app's
# /metrics from inside the network and Grafana shows the provisioned dashboard. Both
# are OFF by default and, when on, bind to the host's loopback only - they are for
# in-box / SSH-tunnel use and do not widen the published surface (still just :8080).
#
#   docker compose --profile observability up -d --build
#   open http://127.0.0.1:3000     # Grafana (admin / $GRAFANA_ADMIN_PASSWORD, default "admin")
#
# See observability/README.md for what each metric means.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ono:prototype
    container_name: ono-app
    env_file:
      - .env
    environment:
      # How the harness reaches the Executor (step 3b wires the orchestrator to it).
      EXECUTOR_URL: http://executor:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a model server (Ollama) on the host
    ports:
      # The ONLY published port in the base stack. Behind the `tls` profile set
      # ONO_APP_BIND=127.0.0.1 so it is reachable from the host only and Caddy's 80/443
      # become the single public surface.
      - "${ONO_APP_BIND:-0.0.0.0}:8080:8080"
    networks:
      - default
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp                 # WORKSPACE_DIR=/tmp/ono-workspace (per-scan clones) lives here
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  executor:
    image: ono:prototype     # same image, different entrypoint - nothing extra to build
    container_name: ono-executor
    command: ["python", "-m", "ono.executor"]
    env_file:
      - .env
    environment:
      EXECUTOR_HOST: 0.0.0.0           # reachable only on the internal network below
      EXECUTOR_PORT: "8081"
      # The shared secret. `.env` must define EXECUTOR_TOKEN (the service refuses to
      # start without one); the `:?` makes `docker compose up` fail loudly if it is unset.
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?EXECUTOR_TOKEN must be set in .env}
      # Jail limits (defaults shown; see Settings.sandbox_* for the full list).
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.13-slim}
      SANDBOX_MEM_MB: ${SANDBOX_MEM_MB:-1024}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-256}
      SANDBOX_CMD_TIMEOUT_S: ${SANDBOX_CMD_TIMEOUT_S:-300}
      SANDBOX_TTL_S: ${SANDBOX_TTL_S:-1800}
      # Dependency provisioning: the one ephemeral container WITH network (pip), hardened like
      # a jail otherwise; its output is shipped read-only into the network-less verifier jail.
      SANDBOX_DEPS_ENABLED: ${SANDBOX_DEPS_ENABLED:-true}
      SANDBOX_DEPS_TIMEOUT_S: ${SANDBOX_DEPS_TIMEOUT_S:-300}
      SANDBOX_DEPS_MAX_MB: ${SANDBOX_DEPS_MAX_MB:-256}
    volumes:
      # PRIVILEGE: the host Docker socket. This is the one place in the stack it appears.
      # The Executor needs it to create/exec/destroy the jailed target containers; the
      # targets themselves never get it (no volumes at all - see jail_kwargs()).
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is root-owned on the host; the image's `ono` user cannot open it. Running
    # the Executor as root *inside its own container* adds no privilege beyond what the
    # socket already grants. (Alternative: keep `user: ono` and add the host docker gid
    # via `group_add: ["<gid>"]`.) The container itself still drops every capability.
    user: "0:0"
    networks:
      - internal             # no `ports:` - never published
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    # Opt-in TLS front door: `docker compose --profile tls up -d`. Not started by a plain
    # `docker compose up`, so the base stack still works on a host without a domain.
    image: caddy:2.10.2-alpine
    container_name: ono-caddy
    profiles: ["tls"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The site address in the Caddyfile: a DNS name (automatic public certificate) or the
      # bare IP together with `tls internal` uncommented in the Caddyfile. Checked by the
      # command below rather than with `${VAR:?}` so the base stack (profile off) never
      # needs it.
      ONO_DOMAIN: ${ONO_DOMAIN:-}
    command:
      - sh
      - -c
      - |
        if [ -z "$$ONO_DOMAIN" ]; then
          echo "ONO_DOMAIN must be set in .env for the tls profile (a DNS name, or the bare IP with 'tls internal' in the Caddyfile)" >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"              # ACME HTTP-01 + redirect to https
      - "443:443"
      - "443:443/udp"        # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates + ACME account: keep it, or re-issue on every restart
      - caddy_config:/config
    networks:
      - default              # reaches `app`; never the internal executor network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE     # ports 80/443 inside the container; nothing else

  # -- Optional observability profile (off unless --profile observability) ------------
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: ono-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # loopback only: in-box / SSH tunnel, never public
    networks:
      - default                 # reaches app:8080; nothing on the internal network
    depends_on:
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana-oss:12.0.2
    container_name: ono-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ono.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # loopback only: in-box / SSH tunnel, never public
    networks:
      - default
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  grafana-data:
  caddy_data:
  caddy_config:

networks:
  default:
  internal:
    internal: true           # no route to the outside world; app <-> executor only
