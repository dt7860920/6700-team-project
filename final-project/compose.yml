# Operation: Negative One - Compose stack for the Deliverable-2 prototype.
#
# One service, one published port. There is deliberately NO database service
# in the skeleton: scan state is in-memory. When the findings DB / threat-intel
# cache / vLLM are added (Deliverable 3) they join this file as internal
# services on the default network WITHOUT a `ports:` block - only the app's
# 8080 is ever published to the host.
#
#   cp .env.example.production .env
#   docker compose up -d
#   curl http://localhost:8080/health

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ono:prototype
    container_name: ono-app
    env_file:
      - .env
    ports:
      - "8080:8080"          # the ONLY published port
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
