[project]
name = "6700-team-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeffrey Pinarchick", email = "jp2249@georgetown.edu" },
    { name = "Kenedy Ducheine", email = "kd937@georgetown.edu"},
    { name = "Sazan Khalid", email = "sk2153@georgetown.edu"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi >=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    ]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.uv.build-backend]
module-name = "team_project"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
